<div style="background-color: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div style="background-color: white; padding: 2rem; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 28rem;">
        <h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1.5rem; text-align: center;">README Generator</h1>

        <div style="margin-bottom: 1.5rem;">
            <div style="display: flex; align-items: center;">
                <input id="api-input" type="text" placeholder="Enter API Key"
                       style="flex-grow: 1; padding: 0.5rem 1rem; border: 1px solid #d1d5db; border-radius: 0.375rem 0 0 0.375rem; outline: none; focus:ring: 2px solid #3b82f6;">
                <button id="get-api-key-btn"
                        style="background-color: #3b82f6; color: white; padding: 0.5rem 1rem; border-radius: 0 0.375rem 0.375rem 0; cursor: pointer; transition: background-color 0.2s; outline: none;">
                    Get API Key here
                </button>
            </div>
        </div>

        <div style="margin-bottom: 1.5rem;">
            <button id="select-folder-btn"
                    style="width: 100%; background-color: #e5e7eb; color: #374151; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; transition: background-color 0.2s; outline: none;">
                Select Folder
            </button>
        </div>

        <div>
            <button
                    style="width: 100%; background-color: #10b981; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; transition: background-color 0.2s; outline: none;">
                Generate README
            </button>
        </div>
    </div>
</div>
